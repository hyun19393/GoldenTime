name: collect

# 실행 신호: cron-job.org가 10분마다 이 워크플로를 호출한다(workflow_dispatch).
# GitHub 예약 실행(schedule)은 이 저장소에서 시작되지 않아 쓰지 않는다. 함께 켜면 실행이 두 배가 되어
# GitHub Pages 빌드 한도(시간당 약 10회)를 넘길 수 있다.
on:
  workflow_dispatch:          # cron-job.org 호출, 또는 Actions 탭에서 직접 실행
    inputs:
      travel_now:
        description: '응급실 사이 이동 시간 표를 지금 바로 계산'
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: 공공데이터 수집
        run: node collector/collect.mjs
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          STAGES: 경기도   # 수집할 시도 (여러 곳이면 쉼표로 구분, 예: 서울특별시,경기도)
      - name: 응급실 사이 이동 시간 (8·13·18·23시)
        if: always()
        continue-on-error: true
        run: node scripts/travel-matrix.mjs
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          FORCE: ${{ inputs.travel_now && '1' || '' }}
      - name: 현황판 요약 만들기
        if: always()
        run: node scripts/build-status.mjs --data data --out docs/status.json
      - name: 웹앱 파일 만들기 (거절 통계표·이동 시간표·계산 코드)
        if: always()
        run: node scripts/build-web.mjs --data data --out docs
      - name: 저장소에 기록
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/status.json docs/model.json docs/model-severe.json docs/travel.json docs/engine
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "collect $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
